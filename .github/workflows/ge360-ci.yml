name: GE360 Trading CI

on:
  push:
    branches: [ main ]
    paths:
      - "GE360.Trading.Core/**"
      - "GE360.Trading.Validation/**"
      - "GE360.Trading.Recovery/**"
      - "GE360.Trading.LeanAdapter/**"
      - "GE360.Trading.LeanAlgorithm/**"
      - "GE360.Trading.AlpacaPluginHost/**"
      - "GE360.Trading.PluginProbe/**"
      - "GE360.Trading.Research/**"
      - "GE360.Trading.Tests/**"
      - "scripts/ge360-smoke-backtest.sh"
      - "scripts/ge360-stage-alpaca-plugin.sh"
      - "scripts/ge360-live-paper-alpaca.sh"
      - "scripts/ge360-install-paper-service.sh"
      - "scripts/ge360-paper-status.sh"
      - "config/ge360-trading-paper.env.example"
      - ".github/workflows/ge360-ci.yml"
  pull_request:
    paths:
      - "GE360.Trading.Core/**"
      - "GE360.Trading.Validation/**"
      - "GE360.Trading.Recovery/**"
      - "GE360.Trading.LeanAdapter/**"
      - "GE360.Trading.LeanAlgorithm/**"
      - "GE360.Trading.AlpacaPluginHost/**"
      - "GE360.Trading.PluginProbe/**"
      - "GE360.Trading.Research/**"
      - "GE360.Trading.Tests/**"
      - "scripts/ge360-smoke-backtest.sh"
      - "scripts/ge360-stage-alpaca-plugin.sh"
      - "scripts/ge360-live-paper-alpaca.sh"
      - "scripts/ge360-install-paper-service.sh"
      - "scripts/ge360-paper-status.sh"
      - "config/ge360-trading-paper.env.example"
      - ".github/workflows/ge360-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build GE360 core
        run: dotnet build GE360.Trading.Core/GE360.Trading.Core.csproj --configuration Release
      - name: Build GE360 validation
        run: dotnet build GE360.Trading.Validation/GE360.Trading.Validation.csproj --configuration Release
      - name: Build GE360 recovery
        run: dotnet build GE360.Trading.Recovery/GE360.Trading.Recovery.csproj --configuration Release
      - name: Build GE360 research harness
        run: dotnet build GE360.Trading.Research/GE360.Trading.Research.csproj --configuration Release
      - name: Run GE360 tests
        run: dotnet test GE360.Trading.Tests/GE360.Trading.Tests.csproj --configuration Release
      - name: Run bundled SPY research smoke
        run: >
          dotnet run
          --project GE360.Trading.Research/GE360.Trading.Research.csproj
          --configuration Release
          --no-build
          --
          --bundled-spy-smoke
          --output artifacts/ge360-research-smoke.json
      - name: Run bundled cross-symbol engineering batch
        run: >
          dotnet run
          --project GE360.Trading.Research/GE360.Trading.Research.csproj
          --configuration Release
          --no-build
          --
          --bundled-equity-batch-smoke
          --output artifacts/ge360-research-batch.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ge360-research-reports
          path: |
            artifacts/ge360-research-smoke.json
            artifacts/ge360-research-batch.json
          if-no-files-found: warn
      - name: Build LEAN adapter
        run: dotnet build GE360.Trading.LeanAdapter/GE360.Trading.LeanAdapter.csproj --configuration Release
      - name: Build GE360 LEAN algorithm
        run: dotnet build GE360.Trading.LeanAlgorithm/GE360.Trading.LeanAlgorithm.csproj --configuration Release
      - name: Stage official Alpaca plugin
        run: bash scripts/ge360-stage-alpaca-plugin.sh
      - name: Build plugin probe
        run: dotnet build GE360.Trading.PluginProbe/GE360.Trading.PluginProbe.csproj --configuration Release
      - name: Verify Alpaca plugin discovery through LEAN Composer
        run: >
          dotnet run
          --project GE360.Trading.PluginProbe/GE360.Trading.PluginProbe.csproj
          --configuration Release
          --no-build
          --
          "${{ github.workspace }}/ge360-plugins/alpaca"
      - name: Validate paper runtime shell scripts
        run: |
          bash -n scripts/ge360-live-paper-alpaca.sh
          bash -n scripts/ge360-install-paper-service.sh
          bash -n scripts/ge360-paper-status.sh
      - name: Verify empty forward-paper summary command
        run: >
          dotnet run
          --project GE360.Trading.Research/GE360.Trading.Research.csproj
          --configuration Release
          --no-build
          --
          --paper-summary
          --paper-store artifacts/ci-forward-paper.json
      - name: Run LEAN smoke with Alpaca plugin loaded
        env:
          GE360_PLUGIN_DIR: "${{ github.workspace }}/ge360-plugins/alpaca"
        run: bash scripts/ge360-smoke-backtest.sh
