name: Bootstrap LEAN snapshot into tradingbot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Import current QuantConnect LEAN source tree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Cloning current QuantConnect/Lean master..."
          git clone --depth 1 --branch master https://github.com/QuantConnect/Lean.git source
          UPSTREAM_SHA="$(git -C source rev-parse HEAD)"

          echo "Removing only upstream workflow files for the token-restricted push..."
          rm -rf source/.git
          rm -rf source/.github/workflows

          TARGET_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone "${TARGET_URL}" target
          cd target

          echo "Replacing repository contents with LEAN snapshot..."
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a ../source/. .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "vendor: import QuantConnect LEAN ${UPSTREAM_SHA} [skip ci]"
          git push --force origin HEAD:main

          echo "LEAN snapshot imported from ${UPSTREAM_SHA}."
