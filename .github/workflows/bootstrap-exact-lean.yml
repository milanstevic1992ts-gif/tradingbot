name: Exact LEAN source import

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Rebuild exact LEAN tree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_COMMIT: 7d534a1bb4252b57845982445f35ea9ffb9b170b
        shell: bash
        run: |
          set -euo pipefail

          mkdir source
          git -C source init
          git -C source remote add origin https://github.com/QuantConnect/Lean.git
          git -C source fetch --depth 1 origin "${UPSTREAM_COMMIT}"
          git -C source checkout --detach FETCH_HEAD
          rm -rf source/.git

          TARGET_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone "${TARGET_URL}" target

          cp target/.github/workflows/bootstrap-exact-lean.yml /tmp/bootstrap-exact-lean.yml

          cd target
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a ../source/. .
          mkdir -p .github/workflows
          cp /tmp/bootstrap-exact-lean.yml .github/workflows/bootstrap-exact-lean.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -A
          git commit -m "vendor: exact QuantConnect LEAN tree ${UPSTREAM_COMMIT} [skip ci]"
          git push --force origin HEAD:main
